#
# Finish a notarization whose verdict arrived after the signing run had ended.
#
# This does not build, does not sign, never loads the Developer ID certificate
# and never submits anything.  It DOES verify the signature that is already
# there - that is the point of it, and it is a different operation entirely.
#
# It exists because on 2026-09-08 a bundle was signed and submitted, the run
# ended before Apple answered, and the signed bytes went with the runner, so a
# later acceptance would have been unusable.
#
# Three questions, asked separately, all of which must be answered before
# anything is stapled:
#
#   1. Is the recovered container authentic?      (its AEAD tag)
#   2. Is it the container we meant?              (compared against values
#                                                  given here, not against
#                                                  what the container says)
#   3. Did Apple accept that submission?          (asked of Apple)
#
# Apple accepting a submission is not on its own permission to finish.
#
name: macOS finish notarization (resume)

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Run id of the signing run that preserved the archive.'
        required: true
        type: string
      submission_id:
        description: 'Submission UUID the archive is bound to.'
        required: true
        type: string
      product_sha:
        description: 'Full commit SHA the product was built from. Checked against the container.'
        required: true
        type: string
      architecture:
        description: 'Architecture of the preserved archive'
        required: true
        type: choice
        default: x86_64
        options:
          - x86_64
          - arm64
      expected_zip_sha256:
        description: 'Fallback when the signing run left no binding record: the sha256 of the submitted ZIP, read from that run log.'
        required: false
        type: string
        default: ''
      upload_artifact:
        description: 'Upload the finished archive. WARNING: this repository is public, so anyone able to read it can download it.'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: macos-notarize-resume
  cancel-in-progress: false

jobs:
  resume:
    name: Staple and verify ${{ inputs.architecture }}
    runs-on: ${{ inputs.architecture == 'x86_64' && 'macos-15-intel' || 'macos-15' }}
    permissions:
      contents: read
      actions: read
    environment: macos-signing
    timeout-minutes: 30
    steps:
      - name: Validate the inputs
        env:
          RUN_ID: ${{ inputs.source_run_id }}
          SUBMISSION_ID: ${{ inputs.submission_id }}
          PRODUCT_SHA: ${{ inputs.product_sha }}
        run: |
          set -euo pipefail
          # All three reach a command line or a comparison, so none is trusted.
          printf '%s' "$RUN_ID" | grep -qE '^[0-9]{1,20}$' \
            || { echo "::error::source_run_id must be a number."; exit 1; }
          printf '%s' "$SUBMISSION_ID" | grep -qE '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$' \
            || { echo "::error::submission_id must be a UUID."; exit 1; }
          printf '%s' "$PRODUCT_SHA" | grep -qE '^[0-9a-f]{40}$' \
            || { echo "::error::product_sha must be a full 40-character commit SHA."; exit 1; }
          echo "run $RUN_ID, submission $SUBMISSION_ID, product $PRODUCT_SHA"

      - name: Checkout the scripts
        # Scripts come from the ref this run was dispatched from, never from
        # the artifact.  Nothing inside a recovered container is executed.
        # actions/checkout v6.0.0
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          sparse-checkout: .github/macos
          sparse-checkout-cone-mode: false

      - name: Fetch the preserved container
        # A run id in this same repository, given explicitly.  Never "the
        # latest artifact with that name", and no URL is accepted.
        # actions/download-artifact v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: signed-bundle-${{ inputs.architecture }}
          path: preserved
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # A signing run that failed to write its binding record still leaves the
      # container behind, and that case is worth being able to finish rather
      # than throwing away an accepted submission.  So this is allowed to be
      # absent, and the fallback below replaces it with something the operator
      # has to state explicitly.
      - name: Fetch the submission binding
        id: fetch_binding
        continue-on-error: true
        # actions/download-artifact v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: submission-${{ inputs.architecture }}
          path: binding
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ask Apple about this submission
        # Asked before anything is opened: if the answer is not Accepted there
        # is nothing to do, and no reason to touch the payload at all.
        env:
          MACOS_NOTARY_API_KEY_P8: ${{ secrets.MACOS_NOTARY_API_KEY_P8 }}
          MACOS_NOTARY_API_KEY_ID: ${{ secrets.MACOS_NOTARY_API_KEY_ID }}
          MACOS_NOTARY_API_ISSUER_ID: ${{ secrets.MACOS_NOTARY_API_ISSUER_ID }}
          SUBMISSION_ID: ${{ inputs.submission_id }}
        run: |
          set -euo pipefail
          chmod +x .github/macos/*.sh
          .github/macos/notary-status.sh --require-accepted "$SUBMISSION_ID"

      - name: Authenticate and recover the archive
        env:
          MACOS_ARTIFACT_KEY: ${{ secrets.MACOS_ARTIFACT_KEY }}
          EXPECT_PRODUCT_SHA: ${{ inputs.product_sha }}
          EXPECT_RUN_ID: ${{ inputs.source_run_id }}
          EXPECT_ARCH: ${{ inputs.architecture }}
          EXPECT_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
        run: .github/macos/restore-artifact.sh preserved "${RUNNER_TEMP}/recovered.zip"

      - name: Check the submission belongs to this archive
        if: steps.fetch_binding.outcome == 'success'
        env:
          MACOS_ARTIFACT_KEY: ${{ secrets.MACOS_ARTIFACT_KEY }}
          EXPECT_RUN_ID: ${{ inputs.source_run_id }}
          EXPECT_SUBMISSION_ID: ${{ inputs.submission_id }}
        run: .github/macos/verify-binding.sh binding "${RUNNER_TEMP}/recovered.zip"

      # Fallback for a signing run that produced no binding record.  The link
      # between this archive and that submission is then asserted by the
      # operator rather than carried by an authenticated record, so it has to
      # be stated as a hash and it is checked against the recovered bytes.
      #
      # It is weaker, and it is labelled as weaker.  The hash comes from the
      # signing run's own log, which GitHub keeps and nobody here can edit,
      # but a log is evidence a human has to read - it is not the same as a
      # record the workflow authenticated by itself.
      - name: Fall back to an operator-supplied hash
        if: steps.fetch_binding.outcome != 'success'
        env:
          EXPECTED_SHA: ${{ inputs.expected_zip_sha256 }}
        run: |
          set -euo pipefail
          echo "::warning::no binding record was found for run ${{ inputs.source_run_id }}."
          if ! printf '%s' "$EXPECTED_SHA" | grep -qE '^[0-9a-f]{64}$'; then
            echo "::error::there is no authenticated record tying this archive to submission"
            echo "::error::${{ inputs.submission_id }}, and no expected_zip_sha256 was given."
            echo "::error::Refusing to staple on the strength of a UUID typed into a form."
            echo "::error::Read the sha256 of the submitted ZIP from the signing run log and"
            echo "::error::pass it as expected_zip_sha256."
            exit 1
          fi
          actual=$(shasum -a 256 "${RUNNER_TEMP}/recovered.zip" | awk '{print $1}')
          if [ "$actual" != "$EXPECTED_SHA" ]; then
            echo "::error::the recovered archive is $actual, not the $EXPECTED_SHA that was"
            echo "::error::submitted.  This is not the archive that submission belongs to."
            exit 1
          fi
          echo "::warning::proceeding on an operator-asserted link, verified against the"
          echo "::warning::recovered bytes: $actual"


      - name: Unpack and check the payload
        run: |
          set -euo pipefail
          mkdir -p work
          /usr/bin/ditto -x -k "${RUNNER_TEMP}/recovered.zip" work
          ls -l work
          # The same gate the signing job applies.
          .github/macos/check-payload.sh work simutrans.app

      - name: Verify the signature that is already there
        # Verification only.  No --sign anywhere in this workflow, and the
        # Developer ID certificate is never loaded.
        id: bundle
        run: |
          set -euo pipefail
          app=work/simutrans.app
          [ -d "$app" ] || { echo "::error::no simutrans.app in the recovered archive."; exit 1; }
          echo "app=$app" >> "$GITHUB_OUTPUT"
          codesign --verify --deep --strict --verbose=4 "$app"
          codesign --display --verbose=4 "$app" 2>&1

      - name: Staple the ticket
        run: |
          set -euo pipefail
          xcrun stapler staple "${{ steps.bundle.outputs.app }}"
          xcrun stapler validate "${{ steps.bundle.outputs.app }}"

      - name: Build the finished archive
        id: archive
        run: |
          set -euo pipefail
          mkdir -p dist stagedir
          cp -R "${{ steps.bundle.outputs.app }}" stagedir/
          name="simumac-${{ inputs.architecture }}-resumed-NOT-FOR-DISTRIBUTION.zip"
          /usr/bin/ditto -c -k --keepParent stagedir "dist/$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "sha256=$(shasum -a 256 "dist/$name" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          ls -l dist

      - name: Verify the finished archive
        run: |
          set -euo pipefail
          symlinks=$(find "${{ steps.bundle.outputs.app }}" -type l | wc -l | tr -d ' ')
          .github/macos/verify.sh "dist/${{ steps.archive.outputs.name }}" \
            "${{ inputs.architecture }}" "$symlinks"

      # The finished archive must not die with the runner either.  Same
      # container, same key, same seven days; it is not uploaded in the clear.
      - name: Preserve the finished archive
        env:
          MACOS_ARTIFACT_KEY: ${{ secrets.MACOS_ARTIFACT_KEY }}
          MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
          MACOS_TEAM_ID: ${{ vars.MACOS_TEAM_ID }}
          SIMU_PRODUCT_SHA: ${{ inputs.product_sha }}
          SIMU_WORKFLOW_SHA: ${{ github.sha }}
          SIMU_REVISION_ID: 'final-stapled'
          SIMU_ARCH: ${{ inputs.architecture }}
          SIMU_NOT_FOR_DISTRIBUTION: 'true'
        run: .github/macos/preserve-artifact.sh "dist/${{ steps.archive.outputs.name }}" final

      - name: Upload the preserved finished archive
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: final-archive-${{ inputs.architecture }}
          path: final/
          retention-days: 7
          if-no-files-found: error

      - name: Summarise
        if: always()
        run: |
          set -euo pipefail
          {
            echo "### Resume: staple and verify"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| source run | ${{ inputs.source_run_id }} |"
            echo "| submission | \`${{ inputs.submission_id }}\` |"
            echo "| product | \`${{ inputs.product_sha }}\` |"
            echo "| architecture | ${{ inputs.architecture }} |"
            echo "| result | ${{ job.status }} |"
            echo "| archive sha256 | \`${{ steps.archive.outputs.sha256 }}\` |"
            echo "| published | no |"
            echo
            echo "Nothing was built, signed or submitted by this run."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the finished archive
        if: success() && inputs.upload_artifact
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.archive.outputs.name }}
          path: dist/${{ steps.archive.outputs.name }}
          retention-days: 5
          if-no-files-found: error
