# This workflow sets up and runs MSBuild and VSTest
# to build and test a Visual Studio solution.

name: Nightly Built Windows ARM64 SDL3

on: [push]

jobs:
  winSDL3-ARM64:
   runs-on: windows-latest
   env:
      VCPKG_BINARY_SOURCES: 'clear;x-gha,readwrite'

   steps:
    - name: Checkout code
      uses: actions/checkout@v6
      id: checkout_code

    - name: Setup MSBuild and add to PATH
      uses: microsoft/setup-msbuild@v3

    - name: Export GitHub Actions Cache Environment Variables
      uses: actions/github-script@v7
      with:
        script: |
          core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');


    - name: Make NSIS
      shell: pwsh
      run:
        ./.github/prepare-nsis.ps1

    - name: Run MSBuild
      shell: pwsh
      working-directory: ${{env.GITHUB_WORKSPACE}}
      # not needed any more: vcpkg x-update-baseline
      run: |
        vcpkg integrate install
        msbuild /m .\Simutrans-SDL3.vcxproj -p:Configuration=Release /p:platform=ARM64

    - name: Build zipfile
      shell: pwsh
      run: |
        move-item "build/SDL3/Simutrans SDL3 Nightly.exe" "simutrans/simutrans.exe"
        move-item "src\Windows\nsis\download-paksets.exe" "simutrans/download-pakset.exe"
        tools/get_lang_files.ps1
        Compress-Archive -Path simutrans -DestinationPath "simuwin-arm-SDL3-nightly.zip"
        dir

    - name: Update binaries of Nightly Release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ./simuwin-arm-SDL3-nightly.zip
        asset_name: simuwin-arm-SDL3-nightly.zip
        tag: Nightly
        overwrite: true
